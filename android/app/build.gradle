apply plugin: 'com.android.application'

android {
    namespace = "com.lottos.app"
    compileSdk = rootProject.ext.compileSdkVersion

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    // versionCode dinâmico: minutos desde 2024-01-01 UTC.
    // Garante valor sempre crescente e único por build, evitando
    // rejeição do Play Console por "versionCode duplicado".
    // Limite do Play é 2.100.000.000 — suficiente por ~4000 anos.
    def autoVersionCode = (int) ((System.currentTimeMillis() - 1704067200000L) / 60000L)

    // versionName automático (major.minor.patch) baseado no contador de builds.
    // - major/minor ficam em android/version.properties e são editados manualmente.
    // - patch é incrementado automaticamente a cada bundleRelease/assembleRelease,
    //   evitando edições manuais antes de cada upload no Play Console.
    def versionPropsFile = rootProject.file("version.properties")
    def versionProps = new Properties()
    if (versionPropsFile.exists()) {
        versionPropsFile.withInputStream { versionProps.load(it) }
    } else {
        versionProps['major'] = '1'
        versionProps['minor'] = '0'
        versionProps['patch'] = '0'
    }

    def vMajor = (versionProps['major'] ?: '1') as String
    def vMinor = (versionProps['minor'] ?: '0') as String
    def vPatch = (versionProps['patch'] ?: '0') as String

    // Só bumpa o patch quando o usuário está realmente gerando um release
    // (bundleRelease / assembleRelease). Builds debug/sync não incrementam.
    def isReleaseBuild = gradle.startParameter.taskNames.any { name ->
        name.toLowerCase().contains('bundlerelease') ||
        name.toLowerCase().contains('assemblerelease')
    }
    if (isReleaseBuild) {
        def nextPatch = (vPatch.toInteger() + 1).toString()
        versionProps['major'] = vMajor
        versionProps['minor'] = vMinor
        versionProps['patch'] = nextPatch
        versionPropsFile.withOutputStream { out ->
            versionProps.store(out, "Auto-bumped patch on release build")
        }
        vPatch = nextPatch
    }

    def autoVersionName = "${vMajor}.${vMinor}.${vPatch}"
    println "[Lottos] versionName=${autoVersionName} versionCode=${autoVersionCode} (releaseBuild=${isReleaseBuild})"

    defaultConfig {
        applicationId "com.lottos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode autoVersionCode
        versionName autoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
